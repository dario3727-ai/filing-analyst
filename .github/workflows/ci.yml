# Runs lint, type check and tests on every push and pull request.
# A red X on a commit in GitHub means one of these steps failed.
name: CI

on:
  push:
  pull_request:

# Read-only access to the repo is all this workflow needs.
permissions:
  contents: read

# If you push twice quickly, cancel the older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies from package-lock.json
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
